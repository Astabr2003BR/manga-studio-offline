<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Studio panel integration test</title><canvas id="page" width="1080" height="1350"></canvas><script src="runtime.js"></script><script>window.ready=false;window.failure=null;window.panels=[{pose:'stand',expression:'neutral',shot:'medium',dialog:'03:00'},{pose:'phone',expression:'worry',shot:'close',dialog:'Quem está aí?'}];let studio;async function init(){try{studio=MangaVRM.createStudio(document.createElement('canvas'));window.stats=await studio.load(await(await fetch('character.vrm')).arrayBuffer());window.ready=true;}catch(e){window.failure=e.message;}}window.renderPanel=async function(i,patch={}){const p={...panels[i],...patch};const data=studio.draw({...p,aspect:1.6,yaw:i? -12:14,background:'room'});const image=new Image();image.src=data;await image.decode();const c=document.getElementById('page').getContext('2d');c.fillStyle='#f6f3ed';c.fillRect(0,i*675,1080,675);c.drawImage(image,40,40+i*675,1000,625);c.fillStyle='#fff';c.fillRect(60,60+i*675,320,56);c.fillStyle='#222';c.font='24px sans-serif';c.fillText(p.dialog,75,95+i*675);panels[i]={...p,data};return data;};init();</script></html>
