name: Manga Studio VRM real render
on:
  push:
    branches: [main]
    paths: ['vrm-lab/**', '.github/workflows/vrm-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manga-vrm-lab
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vrm-lab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manga-vrm-render-evidence
          path: |
            vrm-lab/evidence/
            vrm-lab/dist/
            vrm-lab/package-lock.json
          if-no-files-found: error
          retention-days: 3
